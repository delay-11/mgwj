<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>먹고왔지</title>
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B84A8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Gamja+Flower&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260816b">
</head>
<body>
<div class="app">
  <div class="app-top">
    <header class="appbar">
      <div class="appbar-row">
        <h1>먹고왔지</h1>
        <button class="profile-btn" id="openSettingsBtn" aria-label="설정">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="filters">
      <div class="fchip active" id="catAll" data-cat="전체">전체</div>
      <div class="fchip" id="catFood" data-cat="맛집">맛집</div>
      <div class="fchip" id="catCafe" data-cat="카페">카페</div>
      <div class="fchip" id="regionChip">
        <select id="regionSelect"><option value="전체">지역</option></select>
      </div>
      <div class="fchip" id="districtChip">
        <select id="districtSelect" disabled><option value="전체">시군구</option></select>
      </div>
      <div class="fchip" id="openNowChip">영업중</div>
      <div class="fchip" id="petChip">반려동물 동반</div>
    </div>
  </div>

  <div id="grid" class="grid" style="display:none;"></div>
  <div id="loadingState" class="empty-state">
    <div class="spinner"></div>
    <p>불러오는 중...</p>
  </div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="ico">📍</div>
    <h2>아직 기록한 곳이 없어요</h2>
    <p>오른쪽 아래 + 버튼을 눌러<br>다녀온 곳을 기록해보세요</p>
  </div>

  <button class="fab" id="openAddBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg></button>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=20260816b"></script>
</body>
</html>
